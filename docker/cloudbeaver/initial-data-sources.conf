{
  "folders": {},
  "connections": {
    "resume-builder-postgres": {
      "provider": "postgresql",
      "driver": "postgres-jdbc",
      "name": "Resume Builder (dev)",
      "description": "Local dev database. Password is POSTGRES_PASSWORD from .env.",
      "save-password": false,
      "configuration": {
        "host": "postgres",
        "port": "5432",
        "database": "resume_db",
        "user": "resume_user",
        "url": "jdbc:postgresql://postgres:5432/resume_db",
        "type": "dev",
        "auth-model": "native",
        "provider-properties": {
          "@dbeaver-show-non-default-db@": "true"
        }
      }
    }
  }
}
