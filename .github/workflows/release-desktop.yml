# Builds the desktop app for macOS and Windows and attaches the installers to
# a GitHub release.
#
#   git tag v0.1.0 && git push origin v0.1.0
#
# or run it by hand from the Actions tab, which builds the installers and
# leaves them as workflow artifacts without publishing anything.
#
# One job per platform *and* architecture, because two of the three things that
# go into an installer cannot be cross-built: PyInstaller produces a binary for
# the machine it runs on, and the bundled TeX distribution is likewise
# per-platform. An x64 installer built on an arm64 machine would carry an arm64
# API inside it and fail on the first launch of the machine it was built for.

name: Release desktop app

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

# Deliberately no `paths:` filter. It would apply to tag pushes as well as
# branch ones, and a tag push often fails a path check — which would mean a
# release quietly never building. Cost is kept down by the `plan` job below,
# which builds one platform for a push to main and all of them for a release.

# The release job needs to create a release and upload to it.
permissions:
  contents: write

jobs:
  plan:
    name: Decide what to build
    runs-on: ubuntu-latest
    outputs:
      targets: ${{ steps.pick.outputs.targets }}

    steps:
      # The matrix is decided here rather than with an `if` on the build job,
      # because a job-level `if` cannot see the matrix context — GitHub gives
      # it only github, needs, vars and inputs, and referring to matrix there
      # makes the whole workflow invalid rather than merely wrong.
      - id: pick
        shell: bash
        run: |
          arm='{"name":"macOS (Apple Silicon)","runner":"macos-14","arch":"arm64","platform":"mac"}'
          intel='{"name":"macOS (Intel)","runner":"macos-15-intel","arch":"x64","platform":"mac"}'
          windows='{"name":"Windows","runner":"windows-latest","arch":"x64","platform":"win"}'

          if [ "$GITHUB_REF_TYPE" = "tag" ] || [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            # everything, because this is what people download
            targets="[$arm,$intel,$windows]"
          else
            # a push to main: one platform is enough to notice that packaging
            # broke, which is not something the tests or the typechecker can
            # tell you — the sidecar and the bundled TeX only fail when
            # something actually builds and runs them
            targets="[$arm]"
          fi

          echo "targets=$targets" >> "$GITHUB_OUTPUT"
          echo "Building: $targets"

  build:
    name: ${{ matrix.name }}
    needs: plan
    runs-on: ${{ matrix.runner }}
    # One platform failing should still leave the others to look at, rather
    # than cancelling a 20-minute build because a runner label went stale.
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.targets) }}

    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: actions/setup-node@v7
        with:
          node-version: "24"

      # Pinned to a full version, not a major: setup-uv does not publish a
      # moving v10 tag the way the actions/* ones publish theirs, and a
      # reference that does not resolve fails the job before any step runs.
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true

      - name: Take the version from the tag
        # electron-builder reads the version from package.json, and a release
        # whose installers disagree with the tag they were built from is worse
        # than no version at all.
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          node -e "
            const fs = require('node:fs');
            const path = 'apps/desktop/package.json';
            const manifest = JSON.parse(fs.readFileSync(path, 'utf8'));
            manifest.version = process.argv[1];
            fs.writeFileSync(path, JSON.stringify(manifest, null, '\t') + '\n');
          " "$version"
          echo "Building version $version"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build the API into a binary
        working-directory: apps/api
        run: uv run pyinstaller resume-api.spec --noconfirm --distpath dist --workpath build

      # A few hundred megabytes fetched from CTAN. Worth keeping between runs:
      # it is most of the build's wall time and none of its variability.
      - name: Cache the TeX distribution
        id: tex-cache
        uses: actions/cache@v6
        with:
          path: apps/desktop/resources/texlive
          key: texlive-${{ matrix.runner }}-${{ hashFiles('apps/desktop/scripts/bundle-texlive.sh', 'apps/desktop/scripts/bundle-texlive.ps1') }}

      - name: Bundle TeX (macOS)
        if: matrix.platform == 'mac' && steps.tex-cache.outputs.cache-hit != 'true'
        run: apps/desktop/scripts/bundle-texlive.sh

      - name: Bundle TeX (Windows)
        if: matrix.platform == 'win' && steps.tex-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: apps/desktop/scripts/bundle-texlive.ps1

      - name: Build the app
        run: bun run build:desktop

      # macOS is packaged in two passes so the app can be sealed in between.
      # electron-builder finds no identity in the runner's keychain and signs
      # nothing, which leaves the bundle carrying Electron's own linker-signed
      # signature over a bundle that packaging has since replaced — and macOS
      # calls that "damaged and can't be opened" rather than merely unsigned.
      # Neither hook is usable for the fix: afterPack runs before the Electron
      # fuses are flipped, which rewrites the binary and breaks a fresh
      # signature, and afterSign is skipped entirely when nothing was signed.
      - name: Build the app bundle (macOS)
        if: matrix.platform == 'mac'
        working-directory: apps/desktop
        # Stops electron-builder hunting the runner's keychain for a Developer
        # ID it will not find. It cannot supply an ad-hoc signature itself —
        # mac.identity is matched against the keychain as a search string, so
        # "-" resolves to nothing and signing is skipped silently. The next
        # step does the sealing instead.
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
        run: bunx electron-builder --config electron-builder.yml --mac --${{ matrix.arch }} --dir

      - name: Ad-hoc sign the app (macOS)
        if: matrix.platform == 'mac'
        working-directory: apps/desktop
        run: |
          # electron-builder names the output directory after the arch —
          # release/mac for x64, release/mac-arm64 for arm64 — so find the
          # bundle rather than reproducing that naming rule here.
          app="$(find release -maxdepth 2 -name '*.app' -type d | head -1)"
          if [ -z "$app" ]; then
            echo "No .app under apps/desktop/release" >&2
            ls -la release >&2
            exit 1
          fi
          scripts/adhoc-sign-mac.sh "$app"
          echo "APP_PATH=$app" >> "$GITHUB_ENV"

      - name: Package the dmg (macOS)
        if: matrix.platform == 'mac'
        working-directory: apps/desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
        run: bunx electron-builder --config electron-builder.yml --mac dmg --${{ matrix.arch }} --prepackaged "$APP_PATH" --publish never

      - name: Package the installer (Windows)
        if: matrix.platform == 'win'
        working-directory: apps/desktop
        run: bunx electron-builder --config electron-builder.yml --win --${{ matrix.arch }} --publish never

      - uses: actions/upload-artifact@v7
        with:
          name: installer-${{ matrix.platform }}-${{ matrix.arch }}
          path: |
            apps/desktop/release/*.dmg
            apps/desktop/release/*.exe
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish the release
    needs: build
    # Only for a tag. A manual run builds the installers and stops, so the
    # build can be exercised without publishing anything.
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest

    steps:
      - uses: actions/download-artifact@v8
        with:
          path: installers
          merge-multiple: true

      - name: Attach the installers to a release
        uses: softprops/action-gh-release@v3
        with:
          files: installers/*
          draft: true
          generate_release_notes: true
          body: |
            ## Installing

            **macOS** — download the `arm64` build for Apple Silicon or the
            `x64` build for Intel, open the `.dmg`, and drag the app to
            Applications.

            **Windows** — download and run the `.exe` installer.

            ### These builds are not signed by a known developer

            **macOS** — the app is ad-hoc signed but not notarised by Apple, so
            the first launch is refused. Right-click the app in Applications,
            choose Open, and confirm. On recent macOS that prompt may not offer
            an Open button — open System Settings, Privacy & Security, scroll to
            the bottom and choose Open Anyway.

            If macOS instead says the app is **damaged and should be moved to
            the Trash**, that is the quarantine flag on a download it cannot
            verify, not a corrupt file. Remove it and open the app normally:

            ```
            xattr -dr com.apple.quarantine "/Applications/Resume Builder.app"
            ```

            **Windows** — SmartScreen will warn for the same reason. Choose
            More info, then Run anyway.

            ### What it does

            Everything is stored on your own computer and the app works with no
            account and no network. It carries its own TeX distribution, so
            resumes typeset to a real PDF without installing LaTeX — which is
            why the download is large.
