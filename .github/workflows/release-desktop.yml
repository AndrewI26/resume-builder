# Builds the desktop app for macOS and Windows and attaches the installers to a
# GitHub release:
#
#   git tag v0.1.0 && git push origin v0.1.0
#
# One job per platform *and* architecture. PyInstaller cannot cross-compile and
# the bundled TeX is per-platform, so an x64 installer built on an arm64 machine
# would carry an arm64 API inside it and fail on first launch.

name: Release desktop app

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

# No `paths:` filter on purpose — it would apply to tag pushes too, and a
# release that quietly never builds is worse than a few extra runs.

# One run at a time, and never cancelled. Every push to main both bumps the
# version and publishes, so two runs in flight would read the same version and
# race each other's bump — and a cancelled run leaves a release with only some
# of its installers attached.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  plan:
    name: Decide the version
    runs-on: ubuntu-latest
    outputs:
      targets: ${{ steps.pick.outputs.targets }}
      version: ${{ steps.version.outputs.version }}
      publish: ${{ steps.version.outputs.publish }}

    steps:
      - uses: actions/checkout@v7
        with:
          # A branch, not the detached SHA, because the version bump is pushed
          # back to it.
          ref: ${{ github.ref_name }}

      # Not a job-level `if` on build: that cannot see the matrix context, and
      # referring to matrix there makes the workflow invalid rather than wrong.
      - id: pick
        shell: bash
        run: |
          arm='{"name":"macOS (Apple Silicon)","runner":"macos-14","arch":"arm64","platform":"mac"}'
          intel='{"name":"macOS (Intel)","runner":"macos-15-intel","arch":"x64","platform":"mac"}'
          windows='{"name":"Windows","runner":"windows-latest","arch":"x64","platform":"win"}'

          # Always all three. A release missing a platform is worse than a slow
          # one, and every push to main is now a release.
          echo "targets=[$arm,$intel,$windows]" >> "$GITHUB_OUTPUT"

      # A tag names its own version. A push to main takes the next patch and
      # writes it back, so the number in package.json is always the last one
      # released. The push reuses the credentials actions/checkout persisted,
      # which are GITHUB_TOKEN's — and pushes made with that token do not
      # trigger workflows. That is the only thing stopping this from looping.
      - id: version
        shell: bash
        run: |
          manifest=apps/desktop/package.json

          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            version="${GITHUB_REF_NAME#v}"
            publish=release
          elif [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            # A rehearsal: build everything, bump nothing, publish nothing.
            version="$(node -p "require('./$manifest').version")"
            publish=no
          else
            version="$(node -p "
              const [major, minor, patch] = require('./$manifest').version.split('.');
              [major, minor, Number(patch) + 1].join('.');
            ")"
            publish=prerelease

            node -e "
              const fs = require('node:fs');
              const manifest = JSON.parse(fs.readFileSync('$manifest', 'utf8'));
              manifest.version = '$version';
              fs.writeFileSync('$manifest', JSON.stringify(manifest, null, '\t') + '\n');
            "

            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m "Release $version" -- "$manifest"
            git push origin "HEAD:$GITHUB_REF_NAME"
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "publish=$publish" >> "$GITHUB_OUTPUT"
          echo "Version $version ($publish)"

  build:
    name: ${{ matrix.name }}
    needs: plan
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.targets) }}

    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: actions/setup-node@v7
        with:
          node-version: "24"

      # Full version, not a major: setup-uv publishes no moving v10 tag.
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true

      # electron-builder reads the version from package.json, and this build
      # checked out the commit before the bump.
      - name: Stamp the version
        shell: bash
        run: |
          node -e "
            const fs = require('node:fs');
            const path = 'apps/desktop/package.json';
            const manifest = JSON.parse(fs.readFileSync(path, 'utf8'));
            manifest.version = process.argv[1];
            fs.writeFileSync(path, JSON.stringify(manifest, null, '\t') + '\n');
          " "${{ needs.plan.outputs.version }}"
          echo "Building version ${{ needs.plan.outputs.version }}"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build the API into a binary
        working-directory: apps/api
        run: uv run pyinstaller resume-api.spec --noconfirm --distpath dist --workpath build

      # Most of the build's wall time and none of its variability.
      - name: Cache the TeX distribution
        id: tex-cache
        uses: actions/cache@v6
        with:
          path: apps/desktop/resources/texlive
          key: texlive-${{ matrix.runner }}-${{ hashFiles('apps/desktop/scripts/bundle-texlive.sh', 'apps/desktop/scripts/bundle-texlive.ps1') }}

      - name: Bundle TeX (macOS)
        if: matrix.platform == 'mac' && steps.tex-cache.outputs.cache-hit != 'true'
        run: apps/desktop/scripts/bundle-texlive.sh

      - name: Bundle TeX (Windows)
        if: matrix.platform == 'win' && steps.tex-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: apps/desktop/scripts/bundle-texlive.ps1

      - name: Build the app
        run: bun run build:desktop

      # Two passes with a signing step between them. Do not collapse them:
      # electron-builder signs nothing here, which leaves the bundle carrying
      # Electron's own signature over contents packaging has since replaced, and
      # macOS calls that "damaged" rather than unsigned. It cannot be done from
      # a hook either — afterPack runs before the Electron fuses are flipped,
      # which rewrites the binary, and afterSign never fires when nothing was
      # signed. See scripts/adhoc-sign-mac.sh.
      - name: Build the app bundle (macOS)
        if: matrix.platform == 'mac'
        working-directory: apps/desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
        run: bunx electron-builder --config electron-builder.yml --mac --${{ matrix.arch }} --dir

      - name: Ad-hoc sign the app (macOS)
        if: matrix.platform == 'mac'
        working-directory: apps/desktop
        run: |
          # release/mac for x64, release/mac-arm64 for arm64.
          app="$(find release -maxdepth 2 -name '*.app' -type d | head -1)"
          if [ -z "$app" ]; then
            echo "No .app under apps/desktop/release" >&2
            ls -la release >&2
            exit 1
          fi
          scripts/adhoc-sign-mac.sh "$app"
          echo "APP_PATH=$app" >> "$GITHUB_ENV"

      - name: Package the dmg (macOS)
        if: matrix.platform == 'mac'
        working-directory: apps/desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
        run: bunx electron-builder --config electron-builder.yml --mac dmg --${{ matrix.arch }} --prepackaged "$APP_PATH" --publish never

      - name: Package the installer (Windows)
        if: matrix.platform == 'win'
        working-directory: apps/desktop
        run: bunx electron-builder --config electron-builder.yml --win --${{ matrix.arch }} --publish never

      - uses: actions/upload-artifact@v7
        with:
          name: installer-${{ matrix.platform }}-${{ matrix.arch }}
          path: |
            apps/desktop/release/*.dmg
            apps/desktop/release/*.exe
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish the release
    needs: [plan, build]
    # Not for a manual run, which stays a rehearsal.
    if: needs.plan.outputs.publish != 'no'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/download-artifact@v8
        with:
          path: installers
          merge-multiple: true

      - name: Attach the installers to a release
        uses: softprops/action-gh-release@v3
        with:
          files: installers/*
          tag_name: v${{ needs.plan.outputs.version }}
          name: v${{ needs.plan.outputs.version }}
          draft: false
          # Only a tag becomes Latest. The per-commit builds are downloadable
          # but never what the front page offers.
          prerelease: ${{ needs.plan.outputs.publish == 'prerelease' }}
          generate_release_notes: true
          body: |
            ## Installing

            **macOS** — download the `arm64` build for Apple Silicon or the
            `x64` build for Intel, open the `.dmg`, and drag the app to
            Applications.

            **Windows** — download and run the `.exe` installer.

            ### These builds are not signed by a known developer

            **macOS** — the app is ad-hoc signed but not notarised by Apple, so
            the first launch is refused. Right-click the app in Applications,
            choose Open, and confirm. On recent macOS that prompt may not offer
            an Open button — open System Settings, Privacy & Security, scroll to
            the bottom and choose Open Anyway.

            If macOS instead says the app is **damaged and should be moved to
            the Trash**, that is the quarantine flag on a download it cannot
            verify, not a corrupt file. Remove it and open the app normally:

            ```
            xattr -dr com.apple.quarantine "/Applications/Resume Builder.app"
            ```

            **Windows** — SmartScreen will warn for the same reason. Choose
            More info, then Run anyway.

            ### What it does

            Everything is stored on your own computer and the app works with no
            account and no network. It carries its own TeX distribution, so
            resumes typeset to a real PDF without installing LaTeX — which is
            why the download is large.
