name: resume-builder

x-api-env: &api-env
  # production: secure (https only) cookies, CORS limited to PUBLIC_URL, and
  # the demo seed refuses to run
  NODE_ENV: ${NODE_ENV:-production}

  POSTGRES_HOST: postgres
  POSTGRES_PORT: 5432
  POSTGRES_USER: ${POSTGRES_USER:-resume_user}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD, see .env.prod.example}
  POSTGRES_DB: ${POSTGRES_DB:-resume_db}

  SECRET_KEY: ${SECRET_KEY:?set SECRET_KEY, see .env.prod.example}

  BACKEND_PORT: ${BACKEND_PORT:-8000}

  GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
  GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}

  # The site's address, as the reverse proxy serves it. Sign in with Google
  # lands back here, and the API answers under /api, so there is no default:
  # a wrong one only shows up as a redirect to somewhere else.
  PUBLIC_URL: ${PUBLIC_URL:?set PUBLIC_URL, see .env.prod.example}
  PUBLIC_API_URL: ${PUBLIC_API_URL:-${PUBLIC_URL}/api}

# Nothing here faces the internet: a reverse proxy on the host (Caddy) does.
# Postgres and the worker talk on `internal`, which Docker does not route to
# the host or the outside world. The API also joins `edge`, so it can publish
# a port on the host's loopback for the proxy and reach Google during sign in.
networks:
  internal:
    internal: true
  edge:

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-resume_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD, see .env.prod.example}
      POSTGRES_DB: ${POSTGRES_DB:-resume_db}
    networks: [internal]
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-resume_user} -d ${POSTGRES_DB:-resume_db}"]
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    build: &api-build
      context: ./apps/api
    image: resume-builder-api
    environment: *api-env
    command: ["alembic", "upgrade", "head"]
    restart: "no"
    networks: [internal]
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build: *api-build
    image: resume-builder-api
    restart: unless-stopped
    environment:
      <<: *api-env
    networks: [internal, edge]
    # loopback only: the host's reverse proxy can reach it, nothing else can
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8000}:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen("http://localhost:8000/openapi.json")
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  worker:
    build: *api-build
    image: resume-builder-api
    restart: unless-stopped
    environment:
      <<: *api-env
      LATEX_BACKEND: local
      PDF_WORKER_COUNT: ${PDF_WORKER_COUNT:-3}
    command: ["python", "worker.py"]
    networks: [internal]
    depends_on:
      migrate:
        condition: service_completed_successfully

  # Not a server. Builds the static bundle and copies it into WEB_ROOT on the
  # host, where the reverse proxy serves it, then exits.
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        # fixed rather than read from .env, where the dev setting points the
        # browser straight at the API's port; the proxy serves it at /api
        VITE_API_BASE_URL: /api
    restart: "no"
    network_mode: none
    volumes:
      - ${WEB_ROOT:-./web-root}:/out

volumes:
  postgres_data:
