name: resume-builder

x-api-env: &api-env
  NODE_ENV: ${NODE_ENV:-development}

  POSTGRES_HOST: postgres
  POSTGRES_PORT: 5432
  POSTGRES_USER: ${POSTGRES_USER:-resume_user}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-resume_pass}
  POSTGRES_DB: ${POSTGRES_DB:-resume_db}

  SECRET_KEY: ${SECRET_KEY:-dev-secret-change-me-bae47daada0725cf6676db3931c5fbb}

  BACKEND_PORT: ${BACKEND_PORT:-8000}
  FRONTEND_PORT: ${FRONTEND_PORT:-5173}

  GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
  GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-resume_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-resume_pass}
      POSTGRES_DB: ${POSTGRES_DB:-resume_db}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-resume_user} -d ${POSTGRES_DB:-resume_db}"]
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    build: &api-build
      context: ./apps/api
    image: resume-builder-api
    environment: *api-env
    command: ["alembic", "upgrade", "head"]
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build: *api-build
    image: resume-builder-api
    restart: unless-stopped
    environment:
      <<: *api-env
      PDF_WORKER_COUNT: 0
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen("http://localhost:8000/openapi.json")
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  worker:
    build: *api-build
    image: resume-builder-api
    restart: unless-stopped
    environment:
      <<: *api-env
      LATEX_BACKEND: local
      PDF_WORKER_COUNT: ${PDF_WORKER_COUNT:-3}
    command: ["python", "worker.py"]
    depends_on:
      migrate:
        condition: service_completed_successfully

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:${BACKEND_PORT:-8000}}
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-5173}:80"
    depends_on:
      api:
        condition: service_healthy

volumes:
  postgres_data:
