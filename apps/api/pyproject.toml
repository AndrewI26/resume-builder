[project]
name = "api"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "alembic>=1.19.1",
    "bcrypt>=5.0.0",
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "psycopg2-binary>=2.9.12",
    "psycopg[binary]>=3.3.4",
    "pydantic-settings>=2.15.0",
    "pydantic[email]>=2.13.4",
    "pyjwt[crypto]>=2.13.0",
    "ruff>=0.16.2",
    "sqlalchemy>=2.0.51",
    "uvicorn>=0.52.1",
]

[dependency-groups]
dev = [
    "mypy>=2.3.0",
]

[tool.mypy]
explicit_package_bases = true
mypy_path = "."
plugins = ["pydantic.mypy"]

[tool.ruff.lint]
extend-select = ["I"]
