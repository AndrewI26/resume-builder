[project]
name = "api"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "alembic>=1.19.1",
    "arq>=0.25.0",
    "bcrypt>=5.0.0",
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "psycopg2-binary>=2.9.12",
    "psycopg[binary]>=3.3.4",
    "pydantic-settings>=2.15.0",
    "pydantic[email]>=2.13.4",
    "pyjwt[crypto]>=2.13.0",
    "redis>=8.1.0",
    "ruff>=0.16.2",
    "sqlalchemy>=2.0.51",
    "uvicorn>=0.52.1",
]

[dependency-groups]
dev = [
    "httpx2>=2.0.0",
    "mypy>=2.3.0",
    "pyinstaller>=6.22.2",
    "pytest>=8.4.2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
# anyio ships a pytest plugin and is already a transitive dependency; the
# ``anyio_backend`` fixture in conftest pins it to asyncio.
markers = ["anyio"]

[tool.mypy]
explicit_package_bases = true
mypy_path = "."
plugins = ["pydantic.mypy"]
# dist/ and build/ are PyInstaller's output: copies of this source tree with
# a Python runtime around them, so checking them means checking everything
# twice and reporting the same finding from a path nobody edits.
exclude = ["^alembic/", "^dist/", "^build/"]

strict = true
warn_unreachable = true

[tool.pydantic-mypy]
# Without ``init_typed`` the plugin types every model ``__init__`` as
# ``**data: Any``, which hides passing an ORM row where a schema is expected —
# ``from_attributes`` makes those coerce at runtime, so nothing else catches it.
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true
warn_untyped_fields = true

[[tool.mypy.overrides]]
# pytest's fixture injection makes every test function and fixture untyped at
# the definition site. Annotating ~600 of them buys nothing, so only those two
# checks are relaxed here; the rest of strict still applies to tests.
module = "tests.*"
disallow_untyped_defs = false
disallow_untyped_calls = false
disallow_incomplete_defs = false

[tool.ruff]
extend-exclude = ["alembic", "dist", "build"]

[tool.ruff.lint]
extend-select = ["I"]
