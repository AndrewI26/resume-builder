# Turning the built shell, the API binary and a TeX distribution into something
# a person can install.
#
#   bun run build:desktop && bun run --filter apps-desktop package
#
# Both of the large things this ships are executed as child processes, so
# neither can live inside an asar archive: the operating system runs a file, and
# there is no file inside an archive to run. That is what extraResources means
# here — copied beside the app, left as they are.

appId: com.resumebuilder.desktop
productName: Resume Builder
copyright: ""

directories:
  output: release
  buildResources: build

# The main process, the preload script, and the built app the window loads.
# Nothing else from the checkout belongs in the bundle.
files:
  - dist/**
  - package.json

extraResources:
  # PyInstaller's output. The whole directory, not just the executable: it
  # carries the Python runtime and the alembic migrations the first launch
  # needs to create a database.
  - from: ../api/dist/resume-api
    to: api
  # A TeX distribution, so a compile works on a machine that has never had
  # LaTeX installed. Most of the installer's size, and the reason the app can
  # produce a real PDF offline.
  - from: resources/texlive
    to: texlive

# One architecture per build, and it has to be the machine's own.
#
# electron-builder will happily cross-build the Electron shell, but the two
# things in extraResources are copied as they are — and PyInstaller cannot
# cross-compile, so an x64 dmg built on an Apple Silicon machine ships an arm64
# API inside it and fails on the first launch of a machine that cannot run it.
# The same goes for TeX. So no arch list here: the CLI names one, and CI builds
# each on a runner of that architecture.
mac:
  category: public.app-category.productivity
  target:
    - dmg
  # The app runs a Python binary and a TeX engine it ships. Under the hardened
  # runtime that needs saying explicitly, or the system refuses to execute
  # them — and the failure looks like the app hanging at startup.
  hardenedRuntime: true
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  # Ad-hoc signed, until there is a certificate to sign with properly.
  #
  # Not signing at all is worse than it sounds. The bundle keeps the signature
  # Electron's own binary shipped with, which no longer describes it once the
  # sidecar, the TeX distribution and a new Info.plist are inside — so the
  # signature is invalid rather than absent, and macOS reports an invalid
  # signature as "this app is damaged and can't be opened". On Apple Silicon
  # the right-click-and-Open workaround does not get past that.
  #
  # Ad-hoc signing reseals the bundle as it actually is. It does not make the
  # app trusted — it is still unidentified, and still quarantined when
  # downloaded — but it fails the way an unsigned app is supposed to, with a
  # dialog somebody can get past, rather than looking corrupt.
  identity: "-"

  # Every binary inside extraResources has to be signed too, not just the app.
  # Notarisation checks all of them.
  signIgnore: []

dmg:
  writeUpdateInfo: false

win:
  target:
    - nsis

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true

linux:
  target:
    - AppImage
  category: Office
