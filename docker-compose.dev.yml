services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Turns LaTeX into PDFs, and nothing else.
  #
  # It runs documents it did not write, so it gets a read-only root, no
  # capabilities, and memory and pid ceilings — a runaway \loop should take out
  # one container, not the host. The port is bound to 127.0.0.1 rather than
  # published on every interface, because the API reaches it from the host and
  # nothing else should reach it at all.
  compiler:
    build:
      context: ./apps/compiler
    restart: unless-stopped
    environment:
      COMPILER_TOKEN: ${COMPILER_TOKEN}
      COMPILE_CONCURRENCY: ${COMPILE_CONCURRENCY:-2}
    ports:
      - "127.0.0.1:${COMPILER_PORT:-8100}:8100"
    read_only: true
    tmpfs:
      - /tmp:size=256m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 1g
    pids_limit: 128

  cloudbeaver:
    image: dbeaver/cloudbeaver:26.1
    restart: unless-stopped
    environment:
      CB_SERVER_NAME: ${CLOUDBEAVER_SERVER_NAME}
      CB_SERVER_URL: http://localhost:${CLOUDBEAVER_PORT}
      CB_ADMIN_NAME: ${CLOUDBEAVER_ADMIN_NAME}
      CB_ADMIN_PASSWORD: ${CLOUDBEAVER_ADMIN_PASSWORD}
      # Without this the pre-created connection exists but is invisible to the
      # anonymous (not-signed-in) user, which is how you browse in dev.
      CLOUDBEAVER_APP_GRANT_CONNECTIONS_ACCESS_TO_ANONYMOUS_TEAM: "true"
    ports:
      - "${CLOUDBEAVER_PORT}:8978"
    volumes:
      - cloudbeaver_workspace:/opt/cloudbeaver/workspace
      # Pre-creates the Postgres connection so a fresh clone has one waiting.
      # run-cloudbeaver-server.sh copies this into the workspace on first start
      # only when workspace/.metadata is absent, so it takes effect on a fresh
      # cloudbeaver_workspace volume and never overwrites your saved connections.
      # Do NOT also mount the workspace copy: the script skips the copy when the
      # destination exists, and CloudBeaver needs to write to it to store the
      # password you enter on first connect (deliberately not committed here).
      - ./docker/cloudbeaver/initial-data-sources.conf:/opt/cloudbeaver/conf/initial-data-sources.conf:ro
    depends_on:
      postgres:
        condition: service_healthy

  redis:
    image: redis:latest
    container_name: redis
    restart: always
    ports:
      - "${REDIS_PORT}:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD}

volumes:
  postgres_data:
  cloudbeaver_workspace:
  redis_data:
